services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mood_garden
      POSTGRES_USER: mood_garden
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mood_garden -d mood_garden"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
